name: Windows installer

# Every push to main publishes the game to the "game-latest" release, which installed launchers download from.
# The release lives in this repository unless the GAME_RELEASES_REPO variable names another one (owner/name),
# in which case the GAME_RELEASES_TOKEN secret must be a token that can write releases there.
# It also keeps ConquerSetup.exe in the repository root up to date, so the setup is one click away on the front page.
# That file is only recommitted when the launcher or setup sources change, since game updates reach it via the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RELEASES_REPO: ${{ vars.GAME_RELEASES_REPO || github.repository }}
  RELEASE_TAG: game-latest

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test the launcher
        run: dotnet test installer/Installer.sln

      - name: Pick version
        id: version
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          "setup=1.0.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          "game=$env:GITHUB_RUN_NUMBER-$sha" >> $env:GITHUB_OUTPUT

      - name: Build the game
        shell: pwsh
        run: |
          dotnet publish src/Conquer.Client -c Release -r win-x64 --self-contained true -p:DebugType=none -p:Version=${{ steps.version.outputs.setup }} -o game
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD/game", "$PWD/dist/Conquer-win-x64.zip")
          $zip = Get-Item dist/Conquer-win-x64.zip
          @{
            version = '${{ steps.version.outputs.game }}'
            file    = $zip.Name
            sha256  = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            size    = $zip.Length
          } | ConvertTo-Json | Set-Content dist/latest.json -Encoding utf8NoBOM
          Get-Content dist/latest.json

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) { choco install innosetup -y --no-progress }

      - name: Build the setup
        shell: cmd
        env:
          UPDATE_URL: https://github.com/${{ env.RELEASES_REPO }}/releases/download/${{ env.RELEASE_TAG }}/
        run: installer\build-installer.cmd ${{ steps.version.outputs.setup }}

      - uses: actions/upload-artifact@v4
        with:
          name: ConquerSetup-${{ steps.version.outputs.setup }}
          path: installer/output/ConquerSetup-*.exe
          if-no-files-found: error

      - name: Publish to the game-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GAME_RELEASES_TOKEN || github.token }}
        run: |
          $repo = $env:RELEASES_REPO
          gh release view $env:RELEASE_TAG -R $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $target = if ($repo -eq $env:GITHUB_REPOSITORY) { @('--target', $env:GITHUB_SHA) } else { @() }
            gh release create $env:RELEASE_TAG -R $repo @target --title "Conquer (latest build)" `
              --notes "Download ConquerSetup.exe and run it. The installed game updates itself from this release every time it starts."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Copy-Item installer/output/ConquerSetup-*.exe dist/ConquerSetup.exe
          # latest.json goes last so launchers never see a version whose zip isn't uploaded yet.
          gh release upload $env:RELEASE_TAG -R $repo dist/Conquer-win-x64.zip dist/ConquerSetup.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release upload $env:RELEASE_TAG -R $repo dist/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Runs on pull requests too, as a dry run, so a broken step shows up before it reaches main.
      - name: Commit ConquerSetup.exe to the repository root
        shell: pwsh
        env:
          UPDATE_URL: https://github.com/${{ env.RELEASES_REPO }}/releases/download/${{ env.RELEASE_TAG }}/
        run: |
          # Fingerprint everything the setup is built from; a rebuilt setup with the same inputs is not worth a commit.
          $sources = git ls-files installer | Where-Object { $_ -notmatch 'Tests|setup\.stamp' } | Sort-Object
          $text = ($sources | ForEach-Object { "$_ " + (Get-FileHash $_ -Algorithm SHA256).Hash }) -join "`n"
          $text += "`n$env:UPDATE_URL"
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $stamp = [Convert]::ToHexString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).ToLowerInvariant()
          $old = if (Test-Path installer/setup.stamp) { (Get-Content installer/setup.stamp -Raw).Trim() } else { '' }
          if ((Test-Path ConquerSetup.exe) -and $old -eq $stamp) { Write-Host 'ConquerSetup.exe is current.'; exit 0 }

          Write-Host "Setup sources changed ($old -> $stamp)."
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -or $env:GITHUB_REF -ne 'refs/heads/main') { exit 0 }

          Copy-Item installer/output/ConquerSetup-*.exe ConquerSetup.exe -Force
          Set-Content installer/setup.stamp $stamp -NoNewline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ConquerSetup.exe installer/setup.stamp
          git commit -m 'Update ConquerSetup.exe'
          for ($i = 0; $i -lt 3; $i++) {
            git pull --rebase origin main
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep 5
          }
          exit 1
